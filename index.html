 relative w-full bg-surface px-gutter"><div class="flex flex-col w-full relative min-h-full items-center justify-between px-gutter py-space-xl">
<!-- Subtle ambient background gradients mimicking dawn light over the lagoon -->
<div class="absolute inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-12 left-1/2 -translate-x-1/2 w-80 h-80 rounded-full bg-secondary-container/40 blur-3xl"></div>
<div class="absolute top-1/2 -left-20 w-72 h-72 rounded-full bg-primary-fixed/30 blur-3xl"></div>
<div class="absolute bottom-10 right-0 w-80 h-80 rounded-full bg-surface-container-high/60 blur-3xl"></div>

<div class="w-full flex items-center justify-center pt-space-md">

</div>

<div class="flex flex-col items-center text-center max-w-xs mx-auto my-auto space-y-space-lg">

<div class="relative w-32 h-32 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center p-space-md">
<div class="w-full h-full rounded-full bg-surface-container-low/70 flex items-center justify-center p-3">
<img alt="Ti Pas Logo" class="w-full h-full object-contain filter transition-transform duration-500 hover:rotate-3" src="https://lh3.googleusercontent.com/aida/ALJJyrB-6Ny9utHz5Sb35Z_Itjj00WNQ656P84d3P5c1DcAcR9FZfDLOhfIUqsBAKlTYUC0eFNhuiufoxSwnojdMhyMZoRTVKgp6YIi7c9WMXKDJF5c2A8WxuWaVdNENMeRtOzHkqN216mDfnL0O6WEHWpUmQKhGhyuwmOgpOrjkd4zp-_C8aMjmlSH46a7m81sd4UzIF9LSUw0DXLFIMUUetlBz_We0yPe2ILs3nx9tNF3bgA"/>
</div>
</div>
<!-- Island dewdrop indicator -->
<div class="absolute bottom-1 right-2 w-3.5 h-3.5 rounded-full bg-primary-container shadow-sm flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-surface-container-lowest"></div>
</div>
</div>
<!-- Typography Ensemble -->
<div class="space-y-space-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight font-medium">
        Ti Pas
      </h1>
<p class="font-body-md text-body-md text-tertiary font-normal leading-relaxed px-2">
        One small step a day.<br/>Big change for our island.
      </p>
</div>
<!-- Minimalist tactile line motif -->
<div class="flex items-center space-x-2 pt-space-xs opacity-60">
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
<div class="w-8 h-px bg-outline-variant"></div>
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
</div>
</div>

<div class="w-full max-w-xs flex flex-col items-center space-y-space-md pb-space-lg">
<!-- Primary CTA -->
<button class="w-full h-[54px] rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg tracking-wide flex items-center justify-center gap-space-sm shadow-sm transition-all duration-300 hover:bg-primary active:scale-[0.98] select-none" id="first-step-btn" type="button">
<span>Take my first step</span>
<span class="material-symbols-outlined text-[18px] transition-transform duration-300 group-hover:translate-x-1">
        east
      </span>
</button>
<!-- Creole Poetic Inscription -->
<p class="font-body-sm text-label-sm italic text-tertiary/90 text-center tracking-wide">
      Ensam, enn ti pa apre lot.
    </p>
</div>
</div>
<script>
  (function() {
    const btn = document.getElementById('first-step-btn');
    const pebble = document.getElementById('pebble-container');

    if (btn && pebble) {
      btn.addEventListener('mouseenter', () => {
        pebble.style.transform = 'translateY(-3px)';
      });
      btn.addEventListener('mouseleave', () => {
        pebble.style.transform = 'translateY(0)';
      });
    }
  })();
</script></main></body></html>
